name: ironpulse_fitness
description: "Asistente de entrenamiento de musculación multiplataforma (Android y Windows) con base de datos local escalable, animaciones técnicas y seguimiento de cargas por serie."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  shared_preferences: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.3
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
